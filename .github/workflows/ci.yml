name: Faculty Workload CI

on:
  push:
    branches:
      - main
      - fix/institutional-readiness-remediation
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend_api/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend_api/requirements.txt
      - name: Run backend test suite
        env:
          APP_ENV: test
          DATABASE_URL: sqlite://
        run: python -m unittest backend_api.tests.test_institutional_readiness -v

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: subject_failure_extracted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: subject_failure_extracted/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
